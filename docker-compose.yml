version: "3.9"
# Sovereign Patterns Bible — docker-compose
# Usage: docker-compose up --build

services:
  patterns-bible:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: sovereign-patterns-bible:latest
    container_name: sovereign-patterns-bible
    restart: unless-stopped
    ports:
      - "8794:8794"
    environment:
      SBB_PATTERN_RULES_PATH: ${SBB_PATTERN_RULES_PATH}
      SBB_DEBT_THRESHOLD: ${SBB_DEBT_THRESHOLD}
      SBB_REPORT_FORMAT: ${SBB_REPORT_FORMAT}
      SBB_AUTO_FIX: ${SBB_AUTO_FIX}
      SBB_API_KEY: ${SBB_API_KEY:-change-me}
      SBB_N8N_EVENT_BUS_URL: ${SBB_N8N_EVENT_BUS_URL:-http://host.docker.internal:5678/webhook/event-bus}
      SERVICE_PORT: 8794
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./.data:/app/.data:rw
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8794/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - sbb-platform

networks:
  sbb-platform:
    external: true
    name: sbb-platform-network
